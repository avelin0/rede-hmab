<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Rede Credenciada HMAB 2026</title>
    <style>
        :root { --primary: #1b4332; --accent: #d4af37; --bg: #f9f9f9; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); margin-bottom: 10px; }
        .link-portal { display: inline-block; margin-bottom: 20px; color: var(--secondary-color); font-weight: bold; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex: 1; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .fav { cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Rede Credenciada HMAB 2026</h1>
    <a class="link-portal" href="https://www.hmab.eb.mil.br/images/redecredenciada/LIVRETO-OCSCREDENCIADA.pdf" target="_blank">📄 Acessar PDF Oficial (Atualizado 10/05/2026)</a>

    <div class="controls">
        <input type="text" id="search" placeholder="Filtrar por nome, especialidade ou região...">
        <select id="catFilter">
            <option value="">Todas as Categorias</option>
            <option value="Hospital Geral">Hospital Geral</option>
            <option value="Oftalmologia">Oftalmologia</option>
        </select>
    </div>

    <table id="credTable">
        <thead>
            <tr><th>Fav</th><th>Nome</th><th>Categoria</th><th>Especialidades</th><th>Região</th></tr>
        </thead>
        <tbody id="body"></tbody>
    </table>
</div>

<script>
    let data = [];
    let favs = JSON.parse(localStorage.getItem('favs')) || [];

    fetch('rede_credenciada.csv')
        .then(res => res.text())
        .then(text => {
            // Lógica simples de conversão CSV
            const rows = text.split('\n').slice(1);
            data = rows.map(r => {
                const [id, nome, categoria, especialidades, regiao, dados] = r.split(',');
                return { id, nome, categoria, especialidades, regiao, dados };
            });
            render();
        });

    function render() {
        const body = document.getElementById('body');
        body.innerHTML = '';
        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="fav" onclick="toggleFav('${item.id}')">${favs.includes(item.id) ? '❤️' : '🤍'}</td>
                <td>${item.nome}</td>
                <td>${item.categoria}</td>
                <td>${item.especialidades}</td>
                <td>${item.regiao}</td>
            `;
            body.appendChild(tr);
        });
    }

    function toggleFav(id) {
        favs.includes(id) ? favs = favs.filter(f => f !== id) : favs.push(id);
        localStorage.setItem('favs', JSON.stringify(favs));
        render();
    }
</script>
</body>
</html>
